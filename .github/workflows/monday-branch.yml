name: Monday → branche + PR

# Déclenché depuis Monday (bouton « Créer la branche » sur un item du board Sprints)
# via un webhook qui appelle :
#   POST https://api.github.com/repos/meyergold/site_srn/dispatches
#   { "event_type": "monday-create-branch",
#     "client_payload": { "item_id": "...", "title": "...", "dev": "..." } }
on:
  repository_dispatch:
    types: [monday-create-branch]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: monday-branch-${{ github.event.client_payload.item_id }}
  cancel-in-progress: false

jobs:
  creer:
    runs-on: ubuntu-latest
    env:
      MONDAY_API_TOKEN: ${{ secrets.MONDAY_API_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ITEM_ID: ${{ github.event.client_payload.item_id }}
      TITLE: ${{ github.event.client_payload.title }}
      DEV: ${{ github.event.client_payload.dev }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Valider le payload
        run: |
          case "$ITEM_ID" in
            ''|*[!0-9]*) echo "item_id absent ou non numérique : '$ITEM_ID'"; exit 1 ;;
          esac
          if [ -z "$TITLE" ]; then echo "title absent"; exit 1; fi

      - name: Calculer le nom de branche
        id: nom
        run: |
          source build/scripts/monday.sh
          SLUG=$(printf '%s' "$TITLE" | iconv -f utf-8 -t ascii//TRANSLIT 2>/dev/null || true)
          if [ -z "$SLUG" ]; then SLUG="$TITLE"; fi
          SLUG=$(printf '%s' "$SLUG" \
            | tr '[:upper:]' '[:lower:]' \
            | sed -E 's/[^a-z0-9]+/-/g; s/^-+//; s/-+$//' \
            | cut -c1-40 \
            | sed -E 's/-+$//')
          if [ -z "$SLUG" ]; then SLUG=tache; fi
          {
            echo "base=$(cfg '.git.baseBranch')"
            echo "branch=$(cfg '.git.branchPrefix')/$ITEM_ID-$SLUG"
            echo "item_url=https://$(cfg '.monday.account').monday.com/boards/$(cfg '.monday.boards.backlog')/pulses/$ITEM_ID"
          } >> "$GITHUB_OUTPUT"

      - name: Créer la branche et la PR draft
        id: pr
        env:
          BRANCH: ${{ steps.nom.outputs.branch }}
          BASE: ${{ steps.nom.outputs.base }}
          ITEM_URL: ${{ steps.nom.outputs.item_url }}
        run: |
          set -euo pipefail

          # Idempotent : si la branche existe déjà, on récupère simplement sa PR
          if ! git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git checkout -b "$BRANCH" "origin/$BASE"

            mkdir -p build/tasks
            {
              printf '# %s\n\n' "$TITLE"
              printf -- '- Item Monday : %s\n' "$ITEM_URL"
              printf -- '- Dev : %s\n\n' "${DEV:-non assigné}"
              printf "## Critères d'acceptation\n\n_repris depuis l'item Monday_\n"
            } > "build/tasks/$ITEM_ID.md"

            git add "build/tasks/$ITEM_ID.md"
            git commit -m "Amorce tâche $ITEM_ID : $TITLE"
            git push -u origin "$BRANCH"

            BODY=$(printf '%s\n\n%s\n\n%s\n' \
              "Item Monday : $ITEM_URL" \
              "Dev : ${DEV:-non assigné}" \
              "<!-- monday-item: $ITEM_ID -->")
            gh pr create --draft --base "$BASE" --head "$BRANCH" \
              --title "$TITLE" --body "$BODY" >/dev/null
          fi

          URL=$(gh pr view "$BRANCH" --json url --jq .url)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Renvoyer branche, PR et statut vers Monday
        if: env.MONDAY_API_TOKEN != ''
        env:
          BRANCH: ${{ steps.nom.outputs.branch }}
          PR_URL: ${{ steps.pr.outputs.url }}
        run: |
          source build/scripts/monday.sh
          monday_set_text   "$ITEM_ID" branch "$BRANCH"
          monday_set_text   "$ITEM_ID" pr     "$PR_URL PR"
          monday_set_status "$ITEM_ID" inProgress
          monday_update     "$ITEM_ID" "Branche <b>$BRANCH</b> créée. PR draft : $PR_URL"
