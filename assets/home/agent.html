<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sairen · Agent builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--g1:#FF7B5A;--g2:#FF5D8F;--g3:#B557EE;--g4:#5B6CFF;
  --grad:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,0) 52%),linear-gradient(120deg,#5B6CFF,#9B5CF6,#FF4FA8,#FF6F8B);
  --ink:#1a1730;--muted:#6b6880;--line:#ece9f3;--bg:#FAFAF7}
html,body{height:100%}
body{font-family:'Comfortaa',-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;font-size:14px;overflow:hidden}
.app{height:100vh;display:flex;flex-direction:column}
.hd{display:flex;align-items:center;gap:14px;padding:13px 22px;background:#fff;border-bottom:1px solid var(--line);flex-wrap:wrap}
.back{width:32px;height:32px;border-radius:10px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer;flex:none}
.back svg{width:16px;height:16px}
.av{width:42px;height:42px;border-radius:50%;overflow:hidden;flex:none;box-shadow:0 2px 8px rgba(181,87,238,.25);border:2px solid #fff;outline:1px solid var(--line)}
.av img{width:100%;height:100%;object-fit:cover;display:block}
.who b{font-size:16px;font-weight:700;letter-spacing:-.01em}
.who small{display:inline-flex;align-items:center;gap:6px;color:#16a34a;font-size:11.5px;font-weight:600;margin-top:2px}
.who small::before{content:"";width:7px;height:7px;border-radius:50%;background:#22c55e;box-shadow:0 0 0 3px rgba(34,197,94,.18)}
.tabs{display:flex;gap:2px;margin:0 auto;flex-wrap:wrap}
.tab{position:relative;display:inline-flex;align-items:center;gap:7px;padding:9px 13px;border-radius:10px;color:var(--muted);font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer;white-space:nowrap;background:none;border:0}
.tab svg{width:16px;height:16px;flex:none}
.tab.on{color:#7c3aed;font-weight:600}
.tab.on::after{content:"";position:absolute;left:13px;right:13px;bottom:-14px;height:2px;border-radius:2px;background:linear-gradient(90deg,var(--g3),var(--g4))}
.tab.off{opacity:.42}
.acts{display:inline-flex;align-items:center;gap:9px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 16px;border-radius:13px;font-family:inherit;font-size:13.5px;font-weight:600;cursor:pointer;line-height:1;
  background:#fff;color:#2a2466;border:1px solid rgba(155,92,246,.2);box-shadow:0 8px 22px -14px rgba(40,30,90,.4);transition:transform .2s,box-shadow .2s,border-color .2s}
.btn:hover{transform:translateY(-2px);border-color:rgba(155,92,246,.5);box-shadow:0 16px 34px -16px rgba(123,76,246,.45)}
.btn svg{width:15px;height:15px;flex:none}
.btn.grad{color:#fff;border:0;background-image:var(--grad);background-size:100% 100%,220% 100%;background-position:0 0,0 50%;background-repeat:no-repeat;
  box-shadow:0 14px 34px -12px rgba(123,76,246,.7),0 4px 12px -4px rgba(255,79,168,.45),inset 0 1px 0 rgba(255,255,255,.45);transition:transform .25s,box-shadow .25s,background-position .6s}
.btn.grad:hover{transform:translateY(-2px);background-position:0 0,100% 50%;box-shadow:0 22px 50px -12px rgba(123,76,246,.92),0 8px 20px -6px rgba(255,79,168,.7),inset 0 1px 0 rgba(255,255,255,.5)}
.kebab{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);cursor:pointer}
.kebab svg{width:16px;height:16px}
.bd{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:20px;padding:26px clamp(18px,3vw,34px);overflow:auto}
.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 1px 0 rgba(20,16,50,.03)}
.card+.card{margin-top:18px}
.ch{display:flex;align-items:center;gap:13px;margin-bottom:20px}
.ci{width:42px;height:42px;border-radius:13px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ci svg{width:20px;height:20px;color:#fff}
.ci.purple{background:linear-gradient(135deg,#9B5CF6,#6d28d9)}
.ci.blue{background:linear-gradient(135deg,#3b82f6,#2563eb)}
.ci.pink{background:linear-gradient(135deg,#FF5D8F,#db2777)}
.ch b{display:block;font-size:16px;font-weight:700;letter-spacing:-.01em}
.ch span{display:block;font-size:12.5px;color:var(--muted);margin-top:2px}
.field{margin-top:16px}
.field:first-of-type{margin-top:0}
.lab{display:block;font-size:12px;font-weight:600;color:#4a4663;margin-bottom:7px}
.lab i{color:#e0529c;font-style:normal}
.sel{display:flex;align-items:center;gap:10px;width:100%;padding:12px 14px;border:1.5px solid #e7e3f2;border-radius:12px;background:#fff;font-size:14px;font-weight:500;cursor:pointer}
.sel:hover{border-color:#d6cdf0}
.sel.focus{border-color:#b9a6ee;box-shadow:0 0 0 4px rgba(155,92,246,.12)}
.sel .lg{width:20px;height:20px;object-fit:contain;flex:none}
.sel .cv{margin-left:auto;color:var(--muted);display:inline-flex}
.sel .cv svg{width:16px;height:16px;display:block}
.ta{width:100%;border:1.5px solid #e7e3f2;border-radius:12px;background:#fbfaff;padding:13px 14px;font-family:inherit;font-size:13.5px;color:var(--ink);resize:none;line-height:1.55}
.ta::placeholder{color:#a7a3bd}
.ta.sm{min-height:96px}
.sp-card{border-color:#f0e2f4;background:linear-gradient(180deg,#fefaff,#fff)}
.sp-ta{min-height:430px;border-color:#ecd9f1;background:#fefaff}
@media(max-width:860px){.bd{grid-template-columns:1fr}.tabs{order:3;width:100%;justify-content:flex-start;margin:6px 0 0}}
</style></head>

document.querySelectorAll('.tab').forEach(t=>t.addEventListener('click',()=>{

  t.classList.add('on');
}));
</script>
