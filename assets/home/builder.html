// ════════════════════════════════════════════════════════════════
// POPOVER EVENTS
// ════════════════════════════════════════════════════════════════

function bindPopoverEvents() {
  if (!activePopover) return;

  activePopover.querySelectorAll('[data-trigger]').forEach(el => {
    el.addEventListener('click', () => {
      state.trigger = el.getAttribute('data-trigger');
      state.triggerData = {};
      state.conditions = [];
      closePopover(); render();
      toast('Déclencheur ajouté');
    });
  });

  activePopover.querySelectorAll('[data-channel]').forEach(el => {
    el.addEventListener('click', () => {
      const ch = el.getAttribute('data-channel');
      if (!state.triggerData.channels) state.triggerData.channels = [];
      const idx = state.triggerData.channels.indexOf(ch);
      if (idx >= 0) state.triggerData.channels.splice(idx, 1);
      else state.triggerData.channels.push(ch);
      el.classList.toggle('selected');
      const btn = activePopover.querySelector('.pop-confirm');
      if (btn) btn.textContent = state.triggerData.channels.length ? `Valider (${state.triggerData.channels.length})` : 'Valider';
    });
  });
  const confirmBtn = activePopover.querySelector('.pop-confirm');
  if (confirmBtn && !activePopover.querySelector('#date-confirm')) confirmBtn.addEventListener('click', () => { closePopover(); render(); });

  activePopover.querySelectorAll('[data-schedule]').forEach(el => {
    el.addEventListener('click', () => { state.triggerData.schedule = el.getAttribute('data-schedule'); closePopover(); render(); });
  });

  activePopover.querySelectorAll('[data-mode-pick]').forEach(el => {
    el.addEventListener('click', () => { state.triggerData.mode = el.getAttribute('data-mode-pick'); closePopover(); render(); });
  });

  // Delay preset
  activePopover.querySelectorAll('[data-delay-preset]').forEach(el => {
    el.addEventListener('click', () => {
      const [amount, unit] = el.getAttribute('data-delay-preset').split('|');
      const last = state.actions[state.actions.length - 1];
      if (last && last.type === 'delay' && !last.params?.amount) {
        last.params = { amount: parseInt(amount), unit, businessHours: false };
      } else {
        state.actions.push({ type: 'delay', params: { amount: parseInt(amount), unit, businessHours: false } });
      }
      closePopover(); render();
    });
  });

  // Delay confirm (custom)
  const delayConfirm = activePopover.querySelector('#delay-confirm');
  if (delayConfirm) {
    delayConfirm.addEventListener('click', () => {
      const amount = parseInt(activePopover.querySelector('#delay-amount').value);
      const unit = activePopover.querySelector('#delay-unit').value;
      const businessHours = activePopover.querySelector('#delay-business').checked;
      if (amount > 0) {
        const last = state.actions[state.actions.length - 1];
        if (last && last.type === 'delay' && !last.params?.amount) {
          last.params = { amount, unit, businessHours };
        } else {
          state.actions.push({ type: 'delay', params: { amount, unit, businessHours } });
        }
        closePopover(); render();
      }
    });
  }

  // Agent IA — choix entre existant et nouveau
  activePopover.querySelectorAll('[data-agent-choice]').forEach(el => {
    el.addEventListener('click', () => {
      const choice = el.getAttribute('data-agent-choice');
      const anchor = document.querySelector('[data-edit="action-param-last"]') || document.querySelector('[data-slot="agent"]');
      closePopover();
      if (choice === 'existing') {
        setTimeout(() => {
          if (anchor) {
            showPopover(anchor, buildAgentExistingPopover(), 'agent-popover');
            bindPopoverEvents();
          }
        }, 80);
      } else if (choice === 'new') {
        openAgentConfigModal(null);
      }
    });
  });

  // Pick an existing agent from the list
  activePopover.querySelectorAll('[data-existing-agent]').forEach(el => {
    el.addEventListener('click', () => {
      const agentId = el.getAttribute('data-existing-agent');
      const last = state.actions[state.actions.length - 1];
      if (last && last.type === 'plug_agent') {
        last.params = { ...(last.params || {}), agentId };
      } else {
        state.actions.push({ type: 'plug_agent', params: { agentId } });
      }
      closePopover(); render();
      toast('Agent affilié');
    });
  });

  // Back to choice popover
  activePopover.querySelectorAll('[data-back-to-choice]').forEach(el => {
    el.addEventListener('click', () => {
      const anchor = document.querySelector('[data-edit="action-param-last"]') || document.querySelector('[data-slot="agent"]');
      closePopover();
      setTimeout(() => {
        if (anchor) {
          showPopover(anchor, buildAgentChoicePopover(), 'agent-popover');
          bindPopoverEvents();
        }
      }, 60);
    });
  });

  // Workflow — pick existing
  activePopover.querySelectorAll('[data-existing-workflow]').forEach(el => {
    el.addEventListener('click', () => {
      const workflowId = el.getAttribute('data-existing-workflow');
      const last = state.actions[state.actions.length - 1];
      if (last && last.type === 'plug_workflow') {
        last.params = { ...(last.params || {}), workflowId };
      } else {
        state.actions.push({ type: 'plug_workflow', params: { workflowId } });
      }
      closePopover(); render();
      toast('Workflow plugué');
    });
  });

  // Wait event pick
  activePopover.querySelectorAll('[data-wait-event]').forEach(el => {
    el.addEventListener('click', () => {
      activePopover.querySelectorAll('[data-wait-event]').forEach(x => x.classList.remove('selected'));
      el.classList.add('selected');
    });
  });

  // Wait confirm
  const waitConfirm = activePopover.querySelector('#wait-confirm');
  if (waitConfirm) {
    waitConfirm.addEventListener('click', () => {
      const selectedEvent = activePopover.querySelector('[data-wait-event].selected');
      const event = selectedEvent ? selectedEvent.getAttribute('data-wait-event') : 'reply';
      const amount = parseInt(activePopover.querySelector('#wait-amount').value);
      const unit = activePopover.querySelector('#wait-unit').value;
      if (amount > 0) {
        const last = state.actions[state.actions.length - 1];
        if (last && last.type === 'wait_event' && !last.params?.event) {
          last.params = { event, amount, unit };
        } else {
          state.actions.push({ type: 'wait_event', params: { event, amount, unit } });
        }
        closePopover(); render();
      }
    });
  }

  activePopover.querySelectorAll('[data-date-pick]').forEach(el => {
    el.addEventListener('click', () => { state.triggerData.date = el.getAttribute('data-date-pick'); closePopover(); render(); });
  });

  const dateConfirm = activePopover.querySelector('#date-confirm');
  if (dateConfirm) {
    dateConfirm.addEventListener('click', () => {
      const d = activePopover.querySelector('#date-pick').value;
      const t = activePopover.querySelector('#time-pick').value;
      if (d) {
        const [yyyy, mm, dd] = d.split('-');
        state.triggerData.date = `${dd}/${mm}/${yyyy} ${t || '09:00'}`;
        closePopover(); render();
      }
    });
  }

  activePopover.querySelectorAll('[data-team]').forEach(el => {
    el.addEventListener('click', () => {
      const teamId = el.getAttribute('data-team');
      const last = state.actions[state.actions.length - 1];
      if (last && last.type === 'route_team' && !last.params?.team) last.params = { ...(last.params || {}), team: teamId };
      else state.actions.push({ type: 'route_team', params: { team: teamId } });
      closePopover(); render();
    });
  });

  activePopover.querySelectorAll('[data-template]').forEach(el => {
    el.addEventListener('click', () => {
      const tplId = el.getAttribute('data-template');
      const last = state.actions[state.actions.length - 1];
      if (last && last.type === 'send_message' && !last.params?.template) last.params = { ...(last.params || {}), template: tplId };
      else state.actions.push({ type: 'send_message', params: { template: tplId } });
      closePopover(); render();
    });
  });

  activePopover.querySelectorAll('[data-cond]').forEach(el => {
    el.addEventListener('click', () => {
      const kind = el.getAttribute('data-cond');
      state.conditions.push({ kind, value: null });
      closePopover(); render();
      setTimeout(() => {
        const slot = document.querySelector('[data-edit="cond-last"]');
        if (slot) {
          let opts;
          if (kind === 'has_label')  opts = { defaultTab: 'label',  allowedTabs: ['label'] };
          if (kind === 'in_group')   opts = { defaultTab: 'group',  allowedTabs: ['group'] };
          if (kind === 'in_column')  opts = { defaultTab: 'column', allowedTabs: ['column'] };
          showPopover(slot, buildLabelyPopover(opts));
          activePopover.setAttribute('data-context', 'cond');
          bindPopoverEvents();
        }
      }, 50);
    });
  });

  activePopover.querySelectorAll('[data-pick]').forEach(el => {
    el.addEventListener('click', () => {
      const pickType = el.getAttribute('data-pick');
      const id = el.getAttribute('data-id');
      const ctx = activePopover.getAttribute('data-context');

      if (ctx === 'cond') {
        const lastCond = state.conditions[state.conditions.length - 1];
        if (lastCond) { lastCond.valueKind = pickType; lastCond.value = id; }
      } else if (ctx === 'action_apply_label' || ctx === 'action_remove_label') {
        const lastAction = state.actions[state.actions.length - 1];
        if (lastAction) lastAction.params = { ...(lastAction.params || {}), labelKind: pickType, label: id };
      } else if (ctx === 'trigger_label_target') {
        state.triggerData.labelTargetKind = pickType;
        state.triggerData.labelTarget = id;
      } else if (ctx === 'trigger_column') {
        state.triggerData.column = id;
      }
      closePopover(); render();
    });
  });

  activePopover.querySelectorAll('[data-actionkey]').forEach(el => {
    el.addEventListener('click', () => {
      const actionKey = el.getAttribute('data-actionkey');
      const def = ACTIONS[actionKey];
      state.actions.push({ type: actionKey, params: {} });
      closePopover(); render();
      setTimeout(() => {
        const slot = document.querySelector('[data-edit="action-param-last"]');
        if (slot) {
          let content = null, context = null;
          if (def.needsLabel && actionKey === 'apply_label')  { content = buildLabelyPopover({ defaultTab: 'label', allowedTabs: ['label','group'] }); context = 'action_apply_label'; }
          else if (def.needsLabel && actionKey === 'remove_label') { content = buildLabelyPopover({ defaultTab: 'label', allowedTabs: ['label','group'] }); context = 'action_remove_label'; }
          else if (def.needsTeam) content = buildTeamPopover();
          else if (def.needsTemplate) content = buildTemplatePopover();
          else if (def.needsDelay) content = buildDelayPopover();
          else if (def.needsWaitEvent) content = buildWaitEventPopover();
          else if (def.needsAgent) {
            showPopover(slot, buildAgentChoicePopover(), 'agent-popover');
            bindPopoverEvents();
            return;
          }
          else if (def.needsWorkflow) {
            showPopover(slot, buildWorkflowChoicePopover(), 'agent-popover');
            bindPopoverEvents();
            return;
          }
          if (content) {
            showPopover(slot, content);
            if (context) activePopover.setAttribute('data-context', context);
            bindPopoverEvents();
          }
        }
      }, 50);
    });
  });
}

// ════════════════════════════════════════════════════════════════
// CHIPS / SLOTS
// ════════════════════════════════════════════════════════════════

function labelChip(labelId, editKey, deleteIdx) {
  const l = LABELS[labelId]; if (!l) return '';
  const x = deleteIdx !== undefined ? `<span class="chip-x" data-delete-action="${deleteIdx}">${ICONS.x}</span>` : '';
  return `<span class="chip c-label" style="--label-bg: ${l.color}1A; color: ${l.color};" data-edit="${editKey}">${l.name}<span class="caret">${ICONS.caret}</span>${x}</span>`;
}
function groupChip(groupId, editKey, deleteIdx) {
  const g = GROUPS[groupId]; if (!g) return '';
  const labels = labelsOfGroup(groupId).slice(0, 4);
  const x = deleteIdx !== undefined ? `<span class="chip-x" data-delete-action="${deleteIdx}">${ICONS.x}</span>` : '';
  return `<span class="chip c-group" data-edit="${editKey}">
    <span class="group-glyph">${ICONS.group}</span>${g.name}
    <span class="group-dots">${labels.map(l => `<span class="group-dot" style="background: ${l.color};"></span>`).join('')}</span>
    <span class="caret">${ICONS.caret}</span>${x}
  </span>`;
}
function columnChip(columnId, editKey, deleteIdx) {
  const c = COLUMNS[columnId]; if (!c) return '';
  const x = deleteIdx !== undefined ? `<span class="chip-x" data-delete-action="${deleteIdx}">${ICONS.x}</span>` : '';
  return `<span class="chip c-column" data-edit="${editKey}">
    <span class="col-glyph">${ICONS.column}</span>${c.name}
    <span class="col-intersect">${c.groups.length}∩</span>
    <span class="caret">${ICONS.caret}</span>${x}
  </span>`;
}
function chip(label, chipClass, glyphIcon, editType, deleteIdx, deleteCond) {
  let x = '';
  if (deleteIdx !== undefined) x = `<span class="chip-x" data-delete-action="${deleteIdx}">${ICONS.x}</span>`;
  if (deleteCond !== undefined) x = `<span class="chip-x" data-delete-cond="${deleteCond}">${ICONS.x}</span>`;
  return `<span class="chip ${chipClass}" data-edit="${editType}">
    ${glyphIcon ? `<span class="glyph">${glyphIcon}</span>` : ''}${label}
    <span class="caret">${ICONS.caret}</span>${x}
  </span>`;
}
function slot(label, dataAction, editKey) {
  return `<button class="slot" data-slot="${dataAction}" ${editKey ? `data-edit="${editKey}"` : ''}>${label}</button>`;
}

// ════════════════════════════════════════════════════════════════
// RENDER
// ════════════════════════════════════════════════════════════════

function renderTriggerPhrase() {
  if (!state.trigger) {
    return `<span class="kw">Quand</span> ${slot('choisir un déclencheur', 'trigger')} <span class="punct">.</span>`;
  }

  const t = TRIGGERS[state.trigger];
  let html = `<span class="kw">Quand</span> ${chip(t.label, 'c-event', ICONS[t.icon], 'trigger')}`;

  if (t.needsChannels) {
    const chs = state.triggerData.channels || [];
    if (chs.length === 0) html += ` <span class="kw">sur</span> ${slot('choisir un canal', 'channels')}`;
    else {
      html += ' <span class="kw">sur</span> ';
      html += chs.map(id => {
        const c = CHANNELS.find(c => c.id === id);
        return chip(c.name, c.chipClass, ICONS[c.icon], 'channels');
      }).join(' ');
    }
  }

  if (t.needsLabelTarget) {
    if (!state.triggerData.labelTarget) html += ` ${slot('choisir un label ou groupe', 'trigger_label_target', 'trigger-target-empty')}`;
    else {
      const kind = state.triggerData.labelTargetKind;
      if (kind === 'label')      html += ' ' + labelChip(state.triggerData.labelTarget, 'trigger-target');
      else if (kind === 'group') html += ' ' + groupChip(state.triggerData.labelTarget, 'trigger-target');
    }
  }

  if (t.needsColumn) {
    if (!state.triggerData.column) html += ` ${slot('choisir une colonne', 'trigger_column', 'trigger-col-empty')}`;
    else html += ' ' + columnChip(state.triggerData.column, 'trigger-col');
  }

  if (t.needsSchedule) {
    if (!state.triggerData.schedule) html += ` ${slot('choisir une fréquence', 'schedule')}`;
    else {
      const map = { daily_9: 'tous les jours à 9h00', hourly: 'toutes les heures', weekly_mon: 'tous les lundis matin' };
      html += ` ${chip(map[state.triggerData.schedule], 'c-time', null, 'schedule')}`;
    }
  }

  if (t.needsMode) {
    if (!state.triggerData.mode) html += ` ${slot('choisir un mode', 'trigger_mode', 'trigger-mode-empty')}`;
    else {
      const labels = { human: 'Humain', ai: 'Ulysse (IA)', any: 'l\'un ou l\'autre' };
      const cls = state.triggerData.mode === 'ai' ? 'c-ai' : 'c-status';
      const glyph = state.triggerData.mode === 'ai' ? ICONS.ai : ICONS.team;
      html += ` ${chip(labels[state.triggerData.mode], cls, glyph, 'trigger-mode')}`;
    }
  }

  if (t.needsDate) {
    if (!state.triggerData.date) html += ` ${slot('choisir une date', 'trigger_date', 'trigger-date-empty')}`;
    else html += ` ${chip(state.triggerData.date, 'c-time', ICONS.cron, 'trigger-date')}`;
  }

  // Conditions inline
  state.conditions.forEach((cond, idx) => {
    const isLast = idx === state.conditions.length - 1;
    const editKey = isLast ? 'cond-last' : `cond-${idx}`;
    html += ` <span class="kw">et que le contact</span> `;
    if (cond.kind === 'has_label') {
      html += `<span class="kw">a le label</span> `;
      if (!cond.value) html += slot('choisir un label', 'cond_label', editKey);
      else html += labelChip(cond.value, editKey, undefined) + `<span class="chip-x-floating" data-delete-cond="${idx}" style="display: none;">${ICONS.x}</span>`;
    } else if (cond.kind === 'in_group') {
      html += `<span class="kw">a un label du groupe</span> `;
      if (!cond.value) html += slot('choisir un groupe', 'cond_group', editKey);
      else html += groupChip(cond.value, editKey, undefined);
    } else if (cond.kind === 'in_column') {
      html += `<span class="kw">est dans la colonne</span> `;
      if (!cond.value) html += slot('choisir une colonne', 'cond_column', editKey);
      else html += columnChip(cond.value, editKey, undefined);
    }
    // Always append an inline delete button after the cond chip
    html += ` <button class="cond-delete" data-delete-cond="${idx}" title="Supprimer cette condition">${ICONS.x}</button>`;
  });

  html += ` <span class="punct">,</span>`;
  return html;
}

function renderActionPhrase() {
  if (state.actions.length === 0) {
    if (!isTriggerReady()) return '';
    return `<span class="kw">alors</span> ${slot('choisir une action', 'action')} <span class="punct">.</span>`;
  }

  let html = `<span class="kw">alors</span> `;
  state.actions.forEach((a, idx) => {
    if (idx > 0) html += `<span class="kw">${idx === 1 ? ' et ' : ' puis '}</span>`;

    if (a.type === 'apply_label') {
      html += `<span class="kw">appliquer</span> `;
      if (!a.params?.label) html += slot('choisir un label', 'action_apply_label', 'action-param-last');
      else {
        if (a.params.labelKind === 'group') html += groupChip(a.params.label, `action-applylabel-${idx}`, idx);
        else html += labelChip(a.params.label, `action-applylabel-${idx}`, idx);
      }
    } else if (a.type === 'plug_agent') {
      html += `<span class="kw">faire intervenir</span> `;
      if (!a.params?.agentId) html += slot('choisir un agent IA', 'agent', 'action-param-last');
      else {
        const ag = WORKSPACE_AGENTS.find(x => x.id === a.params.agentId);
        if (!ag) { html += slot('agent introuvable', 'agent', 'action-param-last'); }
        else {
          html += `<span class="chip c-agent" style="--agent-c1: ${SAIREN_AVATARS.find(av => av.id === ag.avatarId)?.c1 || '#676AFE'}; --agent-c2: ${SAIREN_AVATARS.find(av => av.id === ag.avatarId)?.c2 || '#9456F7'}; --agent-accent: ${ag.accent};" data-edit="action-agent-${idx}">
            <span class="agent-avatar">${avatarRender(ag.avatarId)}</span>
            <span class="agent-name">${ag.name}</span>
            <span class="agent-sep">·</span>
            <span class="agent-mission">${ag.role}</span>
            <span class="caret">${ICONS.caret}</span>
            <span class="chip-x" data-delete-action="${idx}">${ICONS.x}</span>
          </span>`;
        }
      }
    } else if (a.type === 'plug_workflow') {
      html += `<span class="kw">déclencher le workflow</span> `;
      if (!a.params?.workflowId) html += slot('choisir un workflow', 'workflow', 'action-param-last');
      else {
        const wf = WORKSPACE_WORKFLOWS.find(x => x.id === a.params.workflowId);
        if (!wf) { html += slot('workflow introuvable', 'workflow', 'action-param-last'); }
        else {
          html += `<span class="chip c-workflow" data-edit="action-workflow-${idx}">
            <span class="glyph">${ICONS.wfnode}</span>
            ${wf.name}
            <span class="caret">${ICONS.caret}</span>
            <span class="chip-x" data-delete-action="${idx}">${ICONS.x}</span>
          </span>`;
        }
      }
    } else if (a.type === 'delay') {
      html += `<span class="kw">attendre</span> `;
      if (!a.params?.amount) html += slot('choisir un délai', 'delay', 'action-param-last');
      else {
        const u = UNITS.find(u => u.id === a.params.unit);
        const unitName = a.params.amount === 1 ? u.name.replace(/s$/, '') : u.plural;
        const businessSuffix = a.params.businessHours ? ' (ouvrés)' : '';
        html += chip(`${a.params.amount} ${unitName}${businessSuffix}`, 'c-time', ICONS.time, `action-delay-${idx}`, idx);
      }
    } else if (a.type === 'wait_event') {
      html += `<span class="kw">attendre que</span> `;
      if (!a.params?.event) html += slot('choisir un événement', 'wait_event', 'action-param-last');
      else {
        const eventLabels = { reply: 'le contact réponde', click: 'le contact clique', open: "le contact ouvre l'email", label: 'un label arrive' };
        const u = UNITS.find(u => u.id === a.params.unit);
        const unitName = a.params.amount === 1 ? u.name.replace(/s$/, '') : u.plural;
        html += chip(`${eventLabels[a.params.event]}, sinon ${a.params.amount} ${unitName}`, 'c-time', ICONS.time, `action-wait-${idx}`, idx);
      }
    } else if (a.type === 'remove_label') {
      html += `<span class="kw">retirer</span> `;
      if (!a.params?.label) html += slot('choisir un label', 'action_remove_label', 'action-param-last');
      else {
        if (a.params.labelKind === 'group') html += groupChip(a.params.label, `action-removelabel-${idx}`, idx);
        else html += labelChip(a.params.label, `action-removelabel-${idx}`, idx);
      }
    } else if (a.type === 'route_team') {
      html += `<span class="kw">router vers</span> `;
      if (!a.params?.team) html += slot('choisir une équipe', 'team', 'action-param-last');
      else {
        const tm = TEAMS.find(t => t.id === a.params.team);
        html += chip(tm.name, 'c-team', ICONS.team, `action-team-${idx}`, idx);
      }
    } else if (a.type === 'send_message') {
      html += `<span class="kw">envoyer</span> `;
      if (!a.params?.template) html += slot('choisir un template', 'template', 'action-param-last');
      else {
        const t = TEMPLATES.find(t => t.id === a.params.template);
        html += chip(t.name, 'c-template', null, `action-template-${idx}`, idx);
      }
    } else {
      const def = ACTIONS[a.type];
      html += chip(def.label, 'c-status', null, `action-${idx}`, idx);
    }
  });
  html += ` <span class="punct">.</span>`;
  return html;
}

function isTriggerReady() {
  if (!state.trigger) return false;
  const t = TRIGGERS[state.trigger];
  if (t.needsChannels && (!state.triggerData.channels || state.triggerData.channels.length === 0)) return false;
  if (t.needsLabelTarget && !state.triggerData.labelTarget) return false;
  if (t.needsColumn && !state.triggerData.column) return false;
  if (t.needsSchedule && !state.triggerData.schedule) return false;
  if (t.needsMode && !state.triggerData.mode) return false;
  if (t.needsDate && !state.triggerData.date) return false;
  for (const c of state.conditions) if (!c.value) return false;
  return true;
}
function isActionsReady() {
  if (state.actions.length === 0) return false;
  for (const a of state.actions) {
    if ((a.type === 'apply_label' || a.type === 'remove_label') && !a.params?.label) return false;
    if (a.type === 'route_team' && !a.params?.team) return false;
    if (a.type === 'send_message' && !a.params?.template) return false;
    if (a.type === 'delay' && !a.params?.amount) return false;
    if (a.type === 'wait_event' && !a.params?.event) return false;
    if (a.type === 'plug_agent' && !a.params?.agentId) return false;
    if (a.type === 'plug_workflow' && !a.params?.workflowId) return false;
  }
  return true;
}
function isComplete() { return isTriggerReady() && isActionsReady(); }

function renderAddRow() {
  const tdone = isTriggerReady();
  const adone = isActionsReady();
  const addRow = document.getElementById('add-row');
  const addActionBtn = document.getElementById('add-action-btn');

  if (tdone) {
    addRow.style.display = 'flex';
    if (adone) addActionBtn.style.display = 'inline-flex';
    else addActionBtn.style.display = 'none';
  } else {
    addRow.style.display = 'none';
  }
}

function renderStats() {
  const stats = document.getElementById('stats-block');
  if (!isComplete()) {
    stats.style.display = 'none';
    return;
  }
  stats.style.display = 'flex';

  const hasAgent = state.actions.some(a => a.type === 'plug_agent');
  const hasAi = hasAgent || state.trigger === 'ai.pca.completed' || state.actions.some(a => ACTIONS[a.type]?.isAi);

  if (hasAgent) {
    const action = state.actions.find(a => a.type === 'plug_agent');
    const agent = WORKSPACE_AGENTS.find(a => a.id === action.params.agentId);
    const agentName = agent?.name || 'Agent';
    document.getElementById('stat-cost').textContent = '~0,012 €';
    document.getElementById('stat-volume').textContent = '~150 / jour';
    document.getElementById('stat-model').textContent = `Agent ${agentName}`;
    document.getElementById('stat-latency').textContent = '1,8s';
  } else if (hasAi) {
    document.getElementById('stat-cost').textContent = '~0,002 €';
    document.getElementById('stat-volume').textContent = '~150 / jour';
    document.getElementById('stat-model').textContent = 'Gemini Flash';
    document.getElementById('stat-latency').textContent = '0,3s';
  } else {
    document.getElementById('stat-cost').textContent = '~0,0005 €';
    document.getElementById('stat-volume').textContent = '~150 / jour';
    document.getElementById('stat-model').textContent = 'Aucun';
    document.getElementById('stat-latency').textContent = '0,1s';
  }
}

function renderActivateBtn() {
  const ok = isComplete();
  document.getElementById('btn-activate').disabled = !ok;
  document.getElementById('btn-test').disabled = !ok;
}

function render() {
  document.getElementById('phrase-trigger').innerHTML = renderTriggerPhrase();
  document.getElementById('phrase-action').innerHTML = renderActionPhrase();
  renderAddRow();
  renderStats();
  renderActivateBtn();
  bindBuilderEvents();
}

// ════════════════════════════════════════════════════════════════
// BUILDER BINDINGS
// ════════════════════════════════════════════════════════════════

function bindBuilderEvents() {
  // Delete action via chip-x (must stop propagation before edit binding)
  document.querySelectorAll('[data-delete-action]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const idx = parseInt(el.getAttribute('data-delete-action'));
      const actionType = state.actions[idx]?.type;
      state.actions.splice(idx, 1);
      render();
      toast('Action supprimée');
    });
  });

  // Delete condition
  document.querySelectorAll('[data-delete-cond]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const idx = parseInt(el.getAttribute('data-delete-cond'));
      state.conditions.splice(idx, 1);
      render();
      toast('Condition supprimée');
    });
  });

  document.querySelectorAll('[data-slot]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const which = el.getAttribute('data-slot');
      let content = null, context = null;
      if (which === 'trigger') content = buildTriggerPopover();
      else if (which === 'channels') content = buildChannelPopover();
      else if (which === 'schedule') content = buildSchedulePopover();
      else if (which === 'trigger_mode') content = buildModePopover();
      else if (which === 'trigger_date') content = buildDatePopover();
      else if (which === 'trigger_label_target') { content = buildLabelyPopover({ defaultTab: 'label', allowedTabs: ['label', 'group'] }); context = 'trigger_label_target'; }
      else if (which === 'trigger_column') { content = buildLabelyPopover({ defaultTab: 'column', allowedTabs: ['column'] }); context = 'trigger_column'; }
      else if (which === 'action') content = buildActionPopover();
      else if (which === 'team') content = buildTeamPopover();
      else if (which === 'template') content = buildTemplatePopover();
      else if (which === 'delay') content = buildDelayPopover();
      else if (which === 'wait_event') content = buildWaitEventPopover();
      else if (which === 'agent') {
        showPopover(el, buildAgentChoicePopover(), 'agent-popover');
        bindPopoverEvents();
        return;
      }
      else if (which === 'workflow') {
        showPopover(el, buildWorkflowChoicePopover(), 'agent-popover');
        bindPopoverEvents();
        return;
      }
      else if (which === 'cond_label') { content = buildLabelyPopover({ defaultTab: 'label', allowedTabs: ['label'] }); context = 'cond'; }
      else if (which === 'cond_group') { content = buildLabelyPopover({ defaultTab: 'group', allowedTabs: ['group'] }); context = 'cond'; }
      else if (which === 'cond_column') { content = buildLabelyPopover({ defaultTab: 'column', allowedTabs: ['column'] }); context = 'cond'; }
      else if (which === 'action_apply_label') { content = buildLabelyPopover({ defaultTab: 'label', allowedTabs: ['label', 'group'] }); context = 'action_apply_label'; }
      else if (which === 'action_remove_label') { content = buildLabelyPopover({ defaultTab: 'label', allowedTabs: ['label', 'group'] }); context = 'action_remove_label'; }
      if (content) {
        showPopover(el, content);
        if (context) activePopover.setAttribute('data-context', context);
        bindPopoverEvents();
      }
    });
  });

  document.querySelectorAll('[data-edit]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const type = el.getAttribute('data-edit');
      let content = null, context = null;
      if (type === 'trigger') content = buildTriggerPopover();
      else if (type === 'channels') content = buildChannelPopover();
      else if (type === 'schedule') content = buildSchedulePopover();
      else if (type.startsWith('trigger-mode')) content = buildModePopover();
      else if (type.startsWith('trigger-date')) content = buildDatePopover();
      else if (type.startsWith('trigger-target')) { content = buildLabelyPopover({ defaultTab: state.triggerData.labelTargetKind || 'label', allowedTabs: ['label', 'group'] }); context = 'trigger_label_target'; }
      else if (type.startsWith('trigger-col')) { content = buildLabelyPopover({ defaultTab: 'column', allowedTabs: ['column'] }); context = 'trigger_column'; }
      else if (type.startsWith('cond-')) {
        const idx = type === 'cond-last' ? state.conditions.length - 1 : parseInt(type.split('-')[1]);
        const cond = state.conditions[idx];
        if (cond) {
          let tab = 'label';
          if (cond.kind === 'in_group') tab = 'group';
          if (cond.kind === 'in_column') tab = 'column';
          content = buildLabelyPopover({ defaultTab: tab, allowedTabs: [tab] });
          context = 'cond';
        }
      }
      else if (type.startsWith('action-applylabel')) { content = buildLabelyPopover({ defaultTab: 'label', allowedTabs: ['label', 'group'] }); context = 'action_apply_label'; }
      else if (type.startsWith('action-removelabel')) { content = buildLabelyPopover({ defaultTab: 'label', allowedTabs: ['label', 'group'] }); context = 'action_remove_label'; }
      else if (type.startsWith('action-team')) content = buildTeamPopover();
      else if (type.startsWith('action-template')) content = buildTemplatePopover();
      else if (type.startsWith('action-agent')) {
        showPopover(el, buildAgentExistingPopover(), 'agent-popover');
        bindPopoverEvents();
        return;
      }
      else if (type.startsWith('action-workflow')) {
        showPopover(el, buildWorkflowChoicePopover(), 'agent-popover');
        bindPopoverEvents();
        return;
      }
      else if (type.startsWith('action-delay')) {
        const idx = parseInt(type.split('-')[2]);
        content = buildDelayPopover(state.actions[idx]?.params);
      }
      else if (type.startsWith('action-wait')) {
        const idx = parseInt(type.split('-')[2]);
        content = buildWaitEventPopover(state.actions[idx]?.params);
      }
      if (content) {
        showPopover(el, content);
        if (context) activePopover.setAttribute('data-context', context);
        bindPopoverEvents();
      }
    });
  });

  document.querySelectorAll('.add-btn[data-action]').forEach(el => {
    el.addEventListener('click', e => {
      e.stopPropagation();
      const which = el.getAttribute('data-action');
      let content = null;
      if (which === 'add-condition') content = buildConditionPopover();
      else if (which === 'add-action') content = buildActionPopover();
      if (content) { showPopover(el, content); bindPopoverEvents(); }
    });
  });
}

let activeAgentModal = null;
let agentModalDraft = null;

function openAgentConfigModal(existingId) {
  closePopover();
  closeAgentConfigModal();

  const editing = existingId ? WORKSPACE_AGENTS.find(a => a.id === existingId) : null;
  agentModalDraft = editing
    ? { ...editing }
    : { id: null, name: '', role: '', avatarId: 'a1', persona: '', confidence: 0.75, accent: '#7C3AED', convCount: 0, lastUsed: 'jamais' };

  const container = document.createElement('div');
  container.innerHTML = buildAgentConfigModal(existingId);
  // Append both overlay and modal
  while (container.firstChild) document.body.appendChild(container.firstChild);
  activeAgentModal = document.getElementById('agent-config-modal');

  // Wire close handlers
  document.getElementById('agent-config-overlay').addEventListener('click', closeAgentConfigModal);
  document.getElementById('modal-close-btn').addEventListener('click', closeAgentConfigModal);
  document.getElementById('modal-cancel-btn').addEventListener('click', closeAgentConfigModal);

  // Avatar picker
  activeAgentModal.querySelectorAll('[data-avatar-pick]').forEach(el => {
    el.addEventListener('click', () => {
      const id = el.getAttribute('data-avatar-pick');
      agentModalDraft.avatarId = id;
      activeAgentModal.querySelectorAll('[data-avatar-pick]').forEach(x => {
        x.classList.toggle('selected', x.getAttribute('data-avatar-pick') === id);
        // Remove or add check mark
        const existingCheck = x.querySelector('.avatar-tile-check');
        if (x.getAttribute('data-avatar-pick') === id && !existingCheck) {
          const check = document.createElement('span');
          check.className = 'avatar-tile-check';
          check.innerHTML = ICONS.check;
          x.appendChild(check);
        } else if (x.getAttribute('data-avatar-pick') !== id && existingCheck) {
          existingCheck.remove();
        }
      });
    });
  });

  // Save handler
  document.getElementById('modal-save-btn').addEventListener('click', () => {
    const name = document.getElementById('agent-name-input').value.trim();
    const role = document.getElementById('agent-role-input').value.trim();
    const persona = document.getElementById('agent-persona-input').value.trim();

    if (!name || !role || !persona) {
      toast('Nom, rôle et persona sont requis');
      return;
    }

    const draftId = agentModalDraft.id || (name.toLowerCase().replace(/[^a-z0-9]+/g, '_') + '_' + Date.now().toString(36));
    const agentData = {
      id: draftId,
      name,
      role,
      avatarId: agentModalDraft.avatarId,
      persona,
      confidence: 0.75,
      accent: '#7C3AED',
      convCount: 0,
      lastUsed: 'à l\'instant',
    };

    if (existingId) {
      // Update in place
      const i = WORKSPACE_AGENTS.findIndex(a => a.id === existingId);
      if (i >= 0) WORKSPACE_AGENTS[i] = agentData;
    } else {
      WORKSPACE_AGENTS.unshift(agentData);
    }

    // Attach to the current action being built (if applicable)
    const last = state.actions[state.actions.length - 1];
    if (last && last.type === 'plug_agent' && !last.params?.agentId) {
      last.params = { ...(last.params || {}), agentId: draftId };
    }

    closeAgentConfigModal();
    render();
    toast(existingId ? 'Agent mis à jour' : 'Agent créé');
  });

  // Real-time avatar update (re-render avatar in field if name changes — light touch)
}

function closeAgentConfigModal() {
  const overlay = document.getElementById('agent-config-overlay');
  const modal = document.getElementById('agent-config-modal');
  if (overlay) overlay.remove();
  if (modal) modal.remove();
  activeAgentModal = null;
  agentModalDraft = null;
}

function toast(msg) {
  const t = document.getElementById('toast');
  t.innerHTML = `${ICONS.check} ${msg}`;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(() => t.classList.remove('show'), 2400);
}

window.addEventListener('message',function(e){var d=e.data;if(d&&d.srnLang)apply(d.srnLang);});
try{if(window.parent&&window.parent.LANG&&window.parent.LANG!=='fr')apply(window.parent.LANG);}catch(e){}
})();
