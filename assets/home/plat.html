<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sairen — La plateforme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--grad:linear-gradient(115deg,#FF6F8B,#FF4FA8,#9B5CF6,#5B6CFF)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Comfortaa',-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.plateforme{position:relative;overflow:hidden;color:#fff;padding:88px 0;background:radial-gradient(120% 80% at 50% 0%,#15172b,#070812 70%)}
.wrap{max-width:1160px;margin:0 auto;padding:0 32px}
.layers-glow{position:absolute;left:50%;top:38%;width:760px;height:760px;transform:translate(-60%,-50%);background:radial-gradient(closest-side,rgba(155,92,246,.24),transparent 70%);filter:blur(20px);pointer-events:none;z-index:0}
.sec-head{text-align:center;max-width:700px;margin:0 auto 52px;position:relative;z-index:2}
.eyebrow2{display:inline-block;font-family:'Geist Mono',monospace;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#cdb6ff;font-weight:500}
.sec-head h2{font-size:clamp(28px,3.9vw,46px);font-weight:800;letter-spacing:-.025em;line-height:1.07;margin:14px 0 12px}
.sec-head h2 em{font-style:normal;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sec-head p{color:#aeb0d4;font-size:16.5px;line-height:1.6}

.grid2{position:relative;z-index:2;display:grid;grid-template-columns:1fr 1fr;gap:56px;align-items:center}
.stack-stage{position:relative;height:500px;perspective:1700px}
.stack{position:absolute;left:50%;top:50%;width:392px;height:188px;transform-style:preserve-3d;transform:translate(-50%,-50%) rotateX(0) rotateZ(0);transition:transform 1.05s cubic-bezier(.2,.85,.25,1)}
.stack.open{transform:translate(-50%,-50%) rotateX(52deg) rotateZ(-30deg)}
.layer{position:absolute;inset:0;border-radius:22px;background:linear-gradient(160deg,rgba(38,40,70,.92),rgba(13,14,30,.92));border:1px solid rgba(255,255,255,.07);box-shadow:0 30px 60px -20px rgba(0,0,0,.7);display:flex;align-items:center;gap:15px;padding:0 24px;transform:translateZ(0);transition:transform .9s cubic-bezier(.2,.85,.25,1),box-shadow .45s,border-color .45s}
.layer::before{content:"";position:absolute;inset:0;border-radius:22px;padding:1px;background:var(--lgrad,linear-gradient(115deg,#666,#888));opacity:.22;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;transition:opacity .45s}
.layer .lic{position:relative;width:44px;height:44px;flex:none;display:grid;place-items:center}
.layer .lic svg{width:30px;height:30px;transition:transform .45s}
.layer .lic .halo{position:absolute;inset:-6px;border-radius:50%;background:var(--lgrad);filter:blur(13px);opacity:0;z-index:-1;transition:opacity .45s}
.layer .lname{font-size:15.5px;font-weight:650;letter-spacing:-.2px;color:#d7d9f0}
.layer .lrole{font-size:12px;color:#9b9dc2;margin-top:1px}.layer .lmeta{flex:1;min-width:0}
.layer.active{border-color:transparent;box-shadow:0 36px 74px -16px var(--lglow,rgba(155,92,246,.5))}
.layer.active::before{opacity:1}.layer.active .lic .halo{opacity:.65}.layer.active .lic svg{transform:scale(1.08)}

.cards{display:flex;flex-direction:column;gap:12px}
.lcard{position:relative;border-radius:18px;padding:16px 18px;cursor:pointer;overflow:hidden;background:linear-gradient(160deg,rgba(255,255,255,.07),rgba(255,255,255,.022));border:1px solid rgba(255,255,255,.10);-webkit-backdrop-filter:blur(12px) saturate(140%);backdrop-filter:blur(12px) saturate(140%);display:flex;align-items:center;gap:15px;transition:transform .45s cubic-bezier(.2,.8,.2,1),border-color .45s,box-shadow .45s,background .45s}
.lcard .blob{position:absolute;width:170px;height:170px;border-radius:50%;left:var(--mx,50%);top:var(--my,50%);transform:translate(-50%,-50%);background:var(--lgrad);filter:blur(48px);opacity:0;pointer-events:none;transition:opacity .45s;z-index:0}
.lcard::before{content:"";position:absolute;inset:0;border-radius:inherit;z-index:1;pointer-events:none;opacity:0;transition:opacity .45s;background:radial-gradient(220px 160px at var(--mx,50%) var(--my,0%),rgba(255,255,255,.24),transparent 62%)}
.lcard::after{content:"";position:absolute;inset:-1px;border-radius:inherit;padding:1px;z-index:2;pointer-events:none;opacity:0;transition:opacity .45s;background:var(--lgrad);-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude}
.lcard>*{position:relative;z-index:3}
.lcard:hover,.lcard.on{transform:translateY(-3px);border-color:transparent;background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.035));box-shadow:0 22px 54px -22px var(--lglow),inset 0 1px 0 rgba(255,255,255,.22)}
.lcard:hover .blob,.lcard.on .blob{opacity:.32}.lcard:hover::before,.lcard.on::before{opacity:1}.lcard:hover::after,.lcard.on::after{opacity:1}
.lcard .ic{position:relative;width:48px;height:48px;flex:none;display:grid;place-items:center}
.lcard .ic svg{width:30px;height:30px;transition:transform .45s}
.lcard .ic .halo{position:absolute;inset:-7px;border-radius:50%;background:var(--lgrad);filter:blur(15px);opacity:0;z-index:-1;transition:opacity .45s}
.lcard:hover .ic .halo,.lcard.on .ic .halo{opacity:.6}.lcard:hover .ic svg,.lcard.on .ic svg{transform:scale(1.08)}
.lcard .body{flex:1;min-width:0}
.lcard .tag{font-size:11px;font-weight:700;letter-spacing:.7px;text-transform:uppercase;color:#8e90c0;transition:.45s}
.lcard:hover .tag,.lcard.on .tag{background:var(--lgrad);-webkit-background-clip:text;background-clip:text;color:transparent}
.lcard h3{font-size:17px;font-weight:700;letter-spacing:-.3px;margin:2px 0 3px;color:#fff}
.lcard p{font-size:13px;line-height:1.45;color:#9b9dc2;font-weight:500}
.lcard.neutral{border-style:dashed;border-color:rgba(255,255,255,.16)}

@media(max-width:920px){.grid2{grid-template-columns:1fr;gap:36px}.stack-stage{height:420px;order:-1}.stack{transform:translate(-50%,-50%) scale(.84)}.stack.open{transform:translate(-50%,-50%) rotateX(50deg) rotateZ(-28deg) scale(.84)}}
@media(max-width:560px){.plateforme{padding:70px 0}.stack-stage{height:380px}.lcard{padding:14px 15px;gap:12px}}
</style>
<style>
html,body{background:transparent!important}
.plateforme{background:transparent!important}
</style></head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<linearGradient id="g_ulysse" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF58AB"/><stop offset=".4" stop-color="#F855DC"/><stop offset=".72" stop-color="#B06FE0"/><stop offset="1" stop-color="#8598E7"/></linearGradient>
<linearGradient id="g_rainbow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#4F1EED"/><stop offset=".34" stop-color="#C951D4"/><stop offset=".68" stop-color="#F52E4E"/><stop offset="1" stop-color="#FEA705"/></linearGradient>
<linearGradient id="g_labels" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#536EF9"/><stop offset=".5" stop-color="#7142F0"/><stop offset="1" stop-color="#B5479E"/></linearGradient>
<linearGradient id="g_ocean" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#00C7D5"/><stop offset=".38" stop-color="#00BBFA"/><stop offset=".72" stop-color="#0C5EF2"/><stop offset="1" stop-color="#3A1EE0"/></linearGradient>
<linearGradient id="g_desk" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FEBD9B"/><stop offset=".42" stop-color="#FC7D4C"/><stop offset=".78" stop-color="#F9550D"/><stop offset="1" stop-color="#E8520F"/></linearGradient>
<linearGradient id="g_socle" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#AEB4CC"/><stop offset="1" stop-color="#717896"/></linearGradient>
</defs></svg>

<section class="plateforme">
  <div class="layers-glow"></div>
  <div class="wrap">
    <div class="sec-head">
      <span class="eyebrow2">La plateforme</span>
      <h2>Quatre briques. <em>Un seul parcours.</em></h2>
      <p>Chaque couche fait une chose, parfaitement — et s'empile sur la précédente. Survolez une brique pour la situer dans la plateforme.</p>
    </div>
    <div class="grid2">
      <div class="stack-stage"><div class="stack" id="stack"></div></div>
      <div class="cards" id="cards"></div>
    </div>
  </div>
</section>

<script>
const ICONS={
 ulysse:`<svg viewBox="0 0 48 48" fill="none" stroke="url(#g_ulysse)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 8L40 40"/><path d="M40 8L8 40"/><path d="M24 8L40 24L24 40L8 24Z"/><g fill="url(#g_ulysse)" stroke="none"><circle cx="8" cy="8" r="2"/><circle cx="8" cy="24" r="2"/><circle cx="8" cy="40" r="2"/><circle cx="24" cy="8" r="2"/><circle cx="24" cy="24" r="2"/><circle cx="24" cy="40" r="2"/><circle cx="40" cy="8" r="2"/><circle cx="40" cy="24" r="2"/><circle cx="40" cy="40" r="2"/></g></svg>`,
 rainbow:`<svg viewBox="0 0 48 48" fill="none" stroke="url(#g_rainbow)" stroke-width="2.6" stroke-linecap="round"><path d="M5 40a19 19 0 0 1 38 0"/><path d="M11 40a13 13 0 0 1 26 0"/><path d="M17 40a7 7 0 0 1 14 0"/><path d="M22.5 40a3 3 0 0 1 5 0"/></svg>`,
 labels:`<svg viewBox="0 0 24 24" fill="none" stroke="url(#g_labels)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.586 2.586A2 2 0 0 0 11.172 2H4a2 2 0 0 0-2 2v7.172a2 2 0 0 0 .586 1.414l8.704 8.704a2.426 2.426 0 0 0 3.42 0l6.58-6.58a2.426 2.426 0 0 0 0-3.42z"/><circle cx="7.5" cy="7.5" r="1.5" fill="url(#g_labels)" stroke="none"/></svg>`,
 ocean:`<svg viewBox="0 0 48 48" fill="none" stroke="url(#g_ocean)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 26c3-6 8-6 9.5 0"/><path d="M14.5 26C14 16 22 11 29 14.8c5.6 3 4 10.2-2.2 10.8-3 .3-4.8-2.4-2.8-4.6"/><path d="M4 33c4-4.2 8.5-4.2 12.5 0s8.5 4.2 12.5 0 8-4.2 12 0"/><path d="M4 40c4-4.2 8.5-4.2 12.5 0s8.5 4.2 12.5 0 8-4.2 12 0"/></svg>`,
 desk:`<svg viewBox="0 0 24 24" fill="none" stroke="url(#g_desk)" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11V9.5A3.5 3.5 0 0 1 7.5 6h9A3.5 3.5 0 0 1 20 9.5V11"/><rect x="3.3" y="11" width="17.4" height="8" rx="1.8"/><path d="M3.3 11h17.4"/><rect x="10.4" y="9.4" width="3.2" height="4.2" rx="1.4"/></svg>`,
 socle:`<svg viewBox="0 0 48 48" fill="none" stroke="url(#g_socle)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M24 7 9 14l15 7 15-7z"/><path d="M9 24l15 7 15-7"/><path d="M9 33l15 7 15-7"/></svg>`
};
const COL={
 ulysse:{grad:'linear-gradient(120deg,#FF58AB,#F855DC,#B06FE0,#8598E7)',glow:'rgba(216,85,220,.5)'},
 rainbow:{grad:'linear-gradient(120deg,#4F1EED,#C951D4,#F52E4E,#FEA705)',glow:'rgba(201,81,212,.45)'},
 labels:{grad:'linear-gradient(120deg,#536EF9,#7142F0,#B5479E)',glow:'rgba(124,79,240,.45)'},
 ocean:{grad:'linear-gradient(120deg,#00C7D5,#00BBFA,#0C5EF2,#3A1EE0)',glow:'rgba(12,94,242,.45)'},
 desk:{grad:'linear-gradient(120deg,#FEBD9B,#FC7D4C,#F9550D,#E8520F)',glow:'rgba(249,85,13,.45)'},
 socle:{grad:'linear-gradient(120deg,#AEB4CC,#717896)',glow:'rgba(148,163,184,.3)'}
};
const MODS=[
 {key:'ulysse', i:5, name:'Ulysse',  tag:'Piloter',     role:'Orchestration IA',       desc:"Le copilote IA qui pilote tout. Souverain, jusqu'au modèle."},
 {key:'rainbow',i:4, name:'Rainbow', tag:'Automatiser',  role:'Moteur de parcours',     desc:"Agents IA + workflows. Le déterministe et le stochastique, ensemble. Sans une ligne de code."},
 {key:'labels', i:3, name:'Labels & déclencheurs', tag:'Le socle', role:'Catégorisation & flux', desc:"Catégorisation, vues dynamiques, déclenchement des flux — la donnée qui arme vos automatisations."},
 {key:'ocean',  i:2, name:'Océan',   tag:'Communiquer',  role:'Conversation omnicanale',desc:"Tous vos canaux unifiés : WhatsApp, voix, e-mail, réseaux. Une seule conversation."},
 {key:'desk',   i:1, name:'Desk',    tag:'Collaborer',   role:'Équipe & ticketing',     desc:"Tâches, communication interne, appli mobile. Vos équipes, structurées."},
 {key:'socle',  i:0, name:'Socle',   tag:'Fondation',    role:'Données & connecteurs',  desc:"Branché au CRM, à l'ERP et aux outils métier. Tout cloud. On-prem."}
];
const ROUTES={ulysse:'#/ulysse',rainbow:'#/rainbow',labels:'#/cas-labels',ocean:'#/ocean',desk:'#/desk',socle:'#/marketplace'};
const stack=document.getElementById('stack'), cardsEl=document.getElementById('cards');
const N=MODS.length, GAP_OPEN=70;
const byI=[...MODS].sort((a,b)=>a.i-b.i);
byI.forEach(m=>{const c=COL[m.key];const l=document.createElement('div');l.className='layer';l.dataset.i=m.i;l.style.setProperty('--lgrad',c.grad);l.style.setProperty('--lglow',c.glow);l.style.zIndex=m.i;
  l.innerHTML=`<div class="lic"><div class="halo"></div>${ICONS[m.key]}</div><div class="lmeta"><div class="lname">${m.name}</div><div class="lrole">${m.role}</div></div>`;l.style.cursor='pointer';l.addEventListener('click',function(){try{parent.postMessage({srnNav:ROUTES[m.key]},'*');}catch(e){}});stack.appendChild(l);});
MODS.forEach(m=>{const c=COL[m.key];const card=document.createElement('div');card.className='lcard'+(m.key==='socle'?' neutral':'');card.dataset.i=m.i;
  card.style.setProperty('--lgrad',c.grad);card.style.setProperty('--lglow',c.glow);
  card.innerHTML=`<div class="blob"></div><div class="ic"><div class="halo"></div>${ICONS[m.key]}</div><div class="body"><span class="tag">${m.tag}</span><h3>${m.name}</h3><p>${m.desc}</p></div>`;card.style.cursor='pointer';card.dataset.route=ROUTES[m.key];card.addEventListener('click',function(){try{parent.postMessage({srnNav:ROUTES[m.key]},'*');}catch(e){}});cardsEl.appendChild(card);});
const layers=[...document.querySelectorAll('.layer')], lcards=[...document.querySelectorAll('.lcard')];
function setActive(i){layers.forEach(l=>l.classList.toggle('active',+l.dataset.i===i));lcards.forEach(c=>c.classList.toggle('on',+c.dataset.i===i));}
let deployed=false;
function deploy(){if(deployed)return;deployed=true;stack.classList.add('open');
  layers.forEach(l=>{const idx=+l.dataset.i,mid=(N-1)/2,off=(idx-mid)*GAP_OPEN;l.style.transitionDelay=(idx*60)+'ms';l.style.transform=`translateZ(${off}px)`;});
  setTimeout(()=>{let k=0;const order=byI.map(m=>m.i);const iv=setInterval(()=>{setActive(order[k]);k++;if(k>=order.length){clearInterval(iv);setActive(5)}},210);},560);}
new IntersectionObserver((es)=>{es.forEach(e=>{if(e.isIntersecting){deploy();}})},{threshold:.3}).observe(document.querySelector('.stack-stage'));
lcards.forEach(card=>{card.addEventListener('mouseenter',()=>{if(deployed)setActive(+card.dataset.i)});
  card.addEventListener('pointermove',e=>{const r=card.getBoundingClientRect();card.style.setProperty('--mx',((e.clientX-r.left)/r.width*100)+'%');card.style.setProperty('--my',((e.clientY-r.top)/r.height*100)+'%');});});
layers.forEach(l=>l.addEventListener('mouseenter',()=>{if(deployed)setActive(+l.dataset.i)}));
cardsEl.addEventListener('mouseleave',()=>{if(deployed)setActive(5)});
</script>
<script>(function(){function rz(){try{parent.postMessage({srnMotion:1,h:Math.ceil(document.body.scrollHeight)},"*");}catch(e){}}if(window.ResizeObserver)new ResizeObserver(rz).observe(document.body);addEventListener("load",rz);[200,700,1500,2800].forEach(function(t){setTimeout(rz,t);});})();</script></body>
</html>
